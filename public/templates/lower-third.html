<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lower Third Headline Graphic Template</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 1920px; height: 1080px;
      background: transparent !important; overflow: hidden;
      font-family: 'Outfit', 'Inter', system-ui, sans-serif;
    }
    .headline-box {
      position: absolute; top: 82%; left: 46%;
      transform: translate(-50%, -50%) scale(0.85);
      opacity: 0;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
      text-align: center; max-width: 1850px; display: flex;
      justify-content: center; align-items: center; white-space: nowrap;
    }
    .headline-box.on-air { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .headline-text { color: #ffffff; font-size: 60px; font-weight: 900; letter-spacing: -1px; }
  </style>
</head>
<body>
  <div id="graphic-container" class="headline-box">
    <span id="f0" class="headline-text"></span>
  </div>

  <script>
    function play() {
      document.getElementById('graphic-container').classList.add('on-air');
    }
    function stop() {
      document.getElementById('graphic-container').classList.remove('on-air');
    }
    function update(str) {
      try {
        let data = (typeof str === 'string') ? JSON.parse(str) : str;
        let textValue = data.f0 || data.headline || data.script || data.text || '';
        document.getElementById('f0').innerText = textValue;
      } catch (err) { console.error('CasparCG update error:', err); }
    }
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('f0')) update({ f0: urlParams.get('f0') });
    });
  </script>
</body>
</html>
